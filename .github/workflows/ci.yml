name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    name: tests (synthetic data only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest

  privacy:
    name: privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run strata privacy-check --all-files

  warehouse:
    name: warehouse and ledger on synthetic data (ingest, quality, dbt, claims, analysis, report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run strata synth --out .strata/synth
      - run: uv run strata ingest --data-dir .strata/synth
      - run: uv run strata dq
      - run: uv run strata dbt build
      - run: uv run strata dbt docs generate
      - run: uv run strata ledger build
      - run: uv run strata analyse all --quick
      - run: uv run strata train all --quick
      - run: uv run strata anomaly run --budget 50
      - run: uv run strata report --variant public

  ledger:
    name: ledger check (documents match the public claims)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run strata ledger check

  dashboard:
    name: dashboard (types, unit tests, build with the bundle check, Storybook)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm storybook:build

  compose:
    name: Docker Compose stack on synthetic data (every endpoint answers; dashboard smoke and axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach
      - run: python3 docker/smoke.py http://localhost:8000
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: pnpm e2e
        working-directory: apps/dashboard
        env:
          STRATA_DASHBOARD_URL: http://localhost:5173
      - if: always()
        run: docker compose logs api dashboard
      - if: always()
        run: docker compose down --volumes
