# Strata on synthetic data: the API, its PostgreSQL review store, the MLflow UI and a placeholder
# for the dashboard (M8). Ports are Strata's defaults: API 8000, PostgreSQL 5432, dashboard 5173,
# MLflow 5000. Nothing here reads the real extract.
name: strata

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STRATA_PG_URL: postgresql+psycopg://strata:strata@postgres:5432/strata
    ports:
      - "8000:8000"
    volumes:
      - work:/data/work
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    volumes:
      - work:/data/work:ro
    depends_on:
      - api

  dashboard:
    image: nginx:1.27.3-alpine
    ports:
      - "5173:80"
    volumes:
      - ./apps/dashboard/placeholder:/usr/share/nginx/html:ro

volumes:
  pgdata: {}
  work: {}
