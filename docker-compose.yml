# Strata on synthetic data: the API, its PostgreSQL review store, the MLflow UI and a placeholder
# for the dashboard (M8). Host ports are Strata's defaults (API 8000, PostgreSQL 5432, dashboard
# 5173, MLflow 5000) and can be moved when a port is taken on the machine, for example
# `STRATA_PG_PORT=55432 docker compose up`. Nothing here reads the real extract.
name: strata

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports:
      - "${STRATA_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STRATA_PG_URL: postgresql+psycopg://strata:strata@postgres:5432/strata
    ports:
      - "${STRATA_API_PORT:-8000}:8000"
    volumes:
      - work:/data/work
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${STRATA_MLFLOW_PORT:-5000}:5000"
    volumes:
      - work:/data/work:ro
    depends_on:
      - api

  dashboard:
    image: nginx:1.27.3-alpine
    ports:
      - "${STRATA_DASHBOARD_PORT:-5173}:80"
    volumes:
      - ./apps/dashboard/placeholder:/usr/share/nginx/html:ro

volumes:
  pgdata: {}
  work: {}
