# Strata on synthetic data: the API, its PostgreSQL review store, the MLflow UI and the dashboard
# (nginx serving the built app and proxying /api/ to the API); Airflow with the daily DAG under
# the `orchestration` profile. Host ports are Strata's defaults
# (API 8000, PostgreSQL 5432, dashboard 5173, MLflow 5000, Airflow 8080); when one is taken, set
# STRATA_*_PORT in the gitignored .env.local, which `just up` passes to Compose. Nothing here reads
# the real extract.
name: strata

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports:
      - "${STRATA_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STRATA_PG_URL: postgresql+psycopg://strata:strata@postgres:5432/strata
    ports:
      - "${STRATA_API_PORT:-8000}:8000"
    volumes:
      - work:/data/work
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${STRATA_MLFLOW_PORT:-5000}:5000"
    volumes:
      - work:/data/work:ro
    depends_on:
      - api

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "${STRATA_DASHBOARD_PORT:-5173}:80"
    depends_on:
      - api

  # The daily DAG on synthetic data, in its own workspace; started only with the profile:
  # `docker compose --profile orchestration up airflow` (UI) or `just dag-test`.
  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "${STRATA_AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_work:/data/work

volumes:
  pgdata: {}
  work: {}
  airflow_work: {}
