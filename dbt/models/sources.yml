version: 2

sources:
  - name: raw
    description: >
      The canonical raw layer written by `strata ingest --mapping <file>`: whatever the source, its
      clients, its dated events and its optional client aggregates arrive in the same three tables
      (ARCHITECTURE section 5.0), so staging and everything above it are source-agnostic. The
      ingest manifest and the data-quality report sit next to them.
    schema: raw
    tables:
      - name: clients
        description: One row per client, with the canonical client attributes.
      - name: events
        description: >
          One row per dated event of any channel: client, timestamp, channel, kind (the label of
          the reference vocabulary), amount, direction, origin, currency, and the file and row it
          came from.
      - name: client_aggregates
        description: >
          Optional pre-aggregated clients. For the reference instance this is a different sample of
          clients, and every other row of its file is empty.
      - name: manifest
        description: One row per loaded file (role, hash, rows, columns, date range, fingerprint).
      - name: dq_report
        description: The data-quality report written by `strata dq` (counts only).
