[project]
name = "kashf"
version = "0.1.0"
description = "Retail-banking behaviour analytics with an evidence ledger, a robustness checker and a structural privacy boundary."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.20",
    "plotly>=5.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "scipy>=1.13",
    "structlog>=24.4",
    "typer>=0.12.5",
]

[project.scripts]
kashf = "kashf.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.112",
    "mypy>=1.11",
    "nbstripout>=0.7.1",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6.9",
    "scipy-stubs>=1.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kashf"]

[tool.hatch.build.targets.sdist]
include = ["kashf", "README.md", "pyproject.toml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
force-exclude = true
extend-exclude = ["legacy", "dbt/target", "dbt/dbt_packages", "dbt/logs", "apps", "node_modules"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PTH", "PIE", "PT", "T20",
    "S", "DTZ", "ERA", "ISC", "RET", "TID", "TC", "PERF", "NPY", "PL", "FBT003", "BLE",
]
ignore = [
    "PLR0913",  # analysis functions legitimately take many keyword parameters
    "PLR2004",  # thresholds are named where they carry meaning; tests compare against literals
    "S603",     # subprocess calls are to git with fixed argument lists
    "S607",     # `git` is resolved from PATH on purpose (Git for Windows and POSIX)
    "TC001", "TC002", "TC003",  # runtime-evaluated annotations are used by pydantic and typer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "PLC0415", "S311"]
"kashf/cli.py" = ["PLC0415", "B008", "PLR0917"]  # lazy imports, typer defaults and options

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["kashf"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=kashf",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]
markers = [
    "private: runs against the real extract in KASHF_DATA_DIR; skipped unless --run-private is given; never asserts on values",
    "slow: end-to-end tests that build the warehouse",
]
xfail_strict = true

[tool.coverage.run]
source = ["kashf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
